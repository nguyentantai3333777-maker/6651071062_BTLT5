<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Câu 23 - Tính lương</title>
        <link rel="stylesheet" href="Styles/style.css">
    </head>
    <body>
        <form>
            <table bgcolor="#FFCC99" width="400">
                <tr>
                    <td width="130">
                        <b>Lương</b>
                    </td>
                    <td>
                        <input type="text" id="luong" value="1000000">
                    </td>
                </tr>
                <tr>
                    <td>
                        <b>Hệ số lương</b>
                    </td>
                    <td>
                        <select id="hs">
                            <option>1.5</option>
                            <option>2.5</option>
                            <option selected>3.2</option>
                            <option>4.0</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="button" value="Tính lương tháng" onclick="tinhLuong()">
                    </td>
                </tr>
                <tr>
                    <td>
                        <b>Lương tháng</b>
                    </td>
                    <td id="kq"></td>
                </tr>
            </table>
        </form>
        <script src="Scripts/cau23.js"></script>
    </body>
</html>
